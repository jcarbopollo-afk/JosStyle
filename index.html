<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JosStyle" />
    <!-- E3 F15 (HC F10, apartado 4) — el icono del iPhone. Sin esto, al añadir
         JosStyle a la pantalla de inicio Safari usa una captura de la página,
         que es lo que el apartado llama "un icono provisional". -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- MS F13 (apartado 37) — las tipografías las pide index.css (`@import`), así que la conexión
         con Google Fonts no empezaba hasta leer el CSS: abrirla ya hace que lleguen antes y que el
         cambio de la letra de respaldo a la buena pase antes de que se vea nada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>JosStyle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
